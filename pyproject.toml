[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-agent-ops"
version = "0.1.0"
description = "On-demand agent operations CLI"
requires-python = ">=3.11"

[project.scripts]
agent = "gway_agent_ops.cli:main"

[tool.setuptools.packages.find]
include = ["gway_agent_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
