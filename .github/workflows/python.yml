name: Python checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Validate CLI
        run: |
          agent --version
          agent --help
          agent issue --help
          python -m pytest -q tests
      - name: Check existing shell helper
        run: bash -n scripts/gway/operator-log.sh
